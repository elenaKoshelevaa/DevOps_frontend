<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DevOps Frontend v2.0</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 22px;
            color: #1f2937;
        }

        h2 {
            margin: 28px 0 12px;
            font-size: 16px;
            color: #374151;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        input, textarea {
            flex: 1;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #4f7cff;
            box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            color: #fff;
            background: #4f7cff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover { background: #3a66e8; }

        #status {
            min-height: 20px;
            margin: 12px 0 0;
            font-size: 14px;
            color: #16a34a;
        }

        #status.error { color: #dc2626; }

        textarea {
            width: 100%;
            margin-top: 12px;
            resize: vertical;
            background: #f9fafb;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>DevOps Frontend v2.0</h1>

    <h2>Отправка данных</h2>
    <div class="row">
        <input type="text" id="text" placeholder="Введите данные здесь">
        <button id="send">Отправить</button>
    </div>
    <p id="status"></p>

    <h2>Получение данных</h2>
    <button id="load">Получить данные</button>
    <textarea id="result" rows="8" readonly placeholder="Здесь появится содержимое data.txt"></textarea>
</div>

<script>
    const API = '/api/data';
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    document.getElementById('send').onclick = async () => {
        const text = document.getElementById('text').value;
        status.className = '';
        try {
            const r = await fetch(API, {
                method: 'POST',
                headers: {'Content-Type': 'text/plain; charset=UTF-8'},
                body: text
            });
            status.textContent = await r.text();
        } catch (e) {
            status.className = 'error';
            status.textContent = 'Не удалось связаться с бэкендом';
        }
    };

    document.getElementById('load').onclick = async () => {
        try {
            const r = await fetch(API);
            if (!r.ok) {
                result.value = 'Ошибка ' + r.status + ': эта версия бэкенда не умеет отдавать данные';
                return;
            }
            result.value = await r.text();
        } catch (e) {
            result.value = 'Не удалось связаться с бэкендом';
        }
    };
</script>
</body>
</html>
